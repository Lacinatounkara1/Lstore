<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APK Store</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1214">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#16191c;--muted:#5d666e;--accent:#0b9a5c;--on:#fff;--border:#e0e5e2;--star:#f5a623;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1214;--card:#1a1e21;--text:#eceff1;--muted:#97a0a8;--accent:#2fd584;--on:#06210f;--border:#2a3035;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1214;--card:#1a1e21;--text:#eceff1;--muted:#97a0a8;--accent:#2fd584;--on:#06210f;--border:#2a3035;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.logo{font-weight:800;letter-spacing:.5px;font-size:1.15rem}.logo b{color:var(--accent)}
.mine{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:18px;padding:7px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
h1{font-size:1.3rem;margin:14px 0 4px}h2{font-size:1.1rem;margin:0}h3{font-size:.95rem;margin:14px 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:24px;background:var(--card);color:var(--text);font-size:1rem;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:6px 13px;font-size:.82rem;cursor:pointer;transition:.2s}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.links{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.links button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:12px 4px;font-size:.76rem;font-weight:600;cursor:pointer;transition:transform .15s}
.links button:active{transform:scale(.95)}
section{margin-top:22px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.all{background:none;border:0;color:var(--accent);font-weight:600;font-size:.85rem;cursor:pointer}
.row{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity}
.row.grid{flex-wrap:wrap;overflow:visible}
.tile{width:84px;flex:none;text-align:center;cursor:pointer;scroll-snap-align:start;opacity:0;animation:up .45s ease forwards;animation-delay:calc(var(--i)*55ms)}
.tile:active .ico{transform:scale(.92)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ico{width:76px;height:76px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 6px;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:transform .15s}
.ico.big{width:84px;height:84px;font-size:2.6rem;margin:0;flex:none}
.ico{color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.tn{font-size:.78rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tm{font-size:.7rem;color:var(--muted)}
.col{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.col button{text-align:left;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:12px;cursor:pointer;transition:transform .15s}
.col button:active{transform:scale(.96)}.col b{display:block;font-size:.9rem}.col span{color:var(--muted);font-size:.78rem}
.btn{position:relative;overflow:hidden;background:var(--accent);color:var(--on);border:0;border-radius:18px;padding:9px 16px;font-size:.85rem;font-weight:600;cursor:pointer;flex:none;transition:transform .15s}
.btn:active{transform:scale(.94)}.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--border)}
.btn.load::after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--on);animation:bar 1s linear forwards}
@keyframes bar{from{width:0}to{width:100%}}
.badge{background:#d93025;color:#fff;border-radius:9px;font-size:.7rem;padding:1px 6px;margin-left:5px}
.card{display:flex;gap:12px;align-items:center;padding:10px 0;cursor:pointer;animation:up .4s ease both}
.info{flex:1;min-width:0}.name{font-weight:600}.meta{color:var(--muted);font-size:.8rem}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:16px;border:0;background:var(--accent);color:var(--on);font-size:1.8rem;box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:pointer;z-index:4;transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:9;max-width:640px;margin:0 auto}.sheet.on{transform:none}
.head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.stars button{background:none;border:0;font-size:1.7rem;color:var(--border);cursor:pointer;padding:0 2px}.stars button.on{color:var(--star);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.4)}}
.rev{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;animation:up .35s ease}
.sheet input{border-radius:12px}
.empty{text-align:center;color:var(--muted);padding:24px}
footer{margin-top:30px;color:var(--muted);font-size:.78rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{opacity:1}}
</style>
</head>
<body>
<main>
  <header><div class="logo">APK<b>STORE</b></div><button class="mine" id="mb">Mes apps<span id="bd"></span></button></header>
  <div id="home">
    <input id="q" type="search" placeholder="Rechercher des jeux et des apps" autocomplete="off">
    <div class="chips" id="pop"></div>
    <div id="body"></div>
  </div>
  <div id="upd" hidden></div>
  <footer>Liens officiels uniquement (Google Play et sites des éditeurs) · © 2026</footer>
</main>
<button class="fab" id="fab" aria-label="Ajouter une app">+</button>
<div class="back" id="back"></div>
<div class="sheet" id="sheet"></div>
<script>

{n:"Subway Surfers",d:"Course sans fin",u:"https://play.google.com/store/apps/details?id=com.kiloo.subwaysurf",k:"g",c:"Arcade",e:"🏃",g:["#38bdf8","#f97316"],t:[]},

];
var pal=[["#c471f5","#7a2fd0"],["#00c6fb","#0072c6"],["#f9d423","#e08e00"],["#ff7eb3","#d6336c"]];
var cols=[["os","Open source"],["off","Fonctionne hors ligne"],["priv","Vie privée"]];
function ld(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var mine=ld("mine",[]),inst=ld("inst",{}),rev=ld("rev",{}),tabs={g:"new",a:"new"},ex={},filt=null,cur=null,rate=0,view=1;
function all(){return base.concat(mine)}
function find(n){return all().filter(function(a){return a.n===n})[0]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function esa(s){return esc(s).replace(/'/g,"&#39;")}
function ico(a,b){return '<div class="ico'+(b?' big':'')+'" style="background:linear-gradient(135deg,'+a.g[0]+','+a.g[1]+')">'+a.e+'</div>'}
function avg(n){var r=rev[n]||[];return r.length?r.reduce(function(s,x){return s+x.s},0)/r.length:null}
function rt(n){var a=avg(n);return a===null?"Pas encore d’avis":"★ "+a.toFixed(1)+" ("+rev[n].length+")"}
function needs(a){return a.v&&inst[a.n]!==undefined&&inst[a.n]!==a.v}
function tile(a,i){return '<div class="tile" style="--i:'+i+'" data-n="'+esa(a.n)+'">'+ico(a)+'<div class="tn">'+esc(a.n)+'</div><div class="tm">'+(a.v?'v'+esc(a.v):'Officiel')+'</div></div>'}
function items(k,t){
  var l=all().filter(function(a){return a.k===k});
  if(t==="new")return l.slice().reverse();
  if(t==="upd")return l.filter(function(a){return a.v}).sort(function(x,y){return (y.ud||0)-(x.ud||0)});
  if(t==="pop")return l.slice().sort(function(x,y){return (avg(y.n)||0)-(avg(x.n)||0)||((rev[y.n]||[]).length-(rev[x.n]||[]).length)});
  return l.filter(function(a){return inst[a.n]!==undefined});
}
function sec(k,title,id){
  var t=tabs[k],l=items(k,t),names={"new":"Nouveau",pop:"Populaire",upd:"Mis à jour",ins:"Installées"};

  return h+'</div><div class="row'+(ex[k]?' grid':'')+'" style="margin-top:8px">'+(l.map(tile).join("")||'<div class="empty" style="width:100%">Rien ici pour le moment.</div>')+'</div></section>';
}

function renderUpd(){
